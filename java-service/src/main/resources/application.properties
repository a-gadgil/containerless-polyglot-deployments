server.address=${APP_HOST:127.0.0.1}
server.port=${APP_PORT:8081}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=15s

spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/javadb}
spring.datasource.username=${DB_USER:javauser}
spring.datasource.password=${DB_PASS:javapass}
spring.datasource.hikari.maximum-pool-size=5

spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000ms

app.cache.ttl-seconds=${CACHE_TTL:30}
