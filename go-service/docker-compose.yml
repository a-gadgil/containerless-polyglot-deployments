services:
  nginx:
    image: nginx:1.27-alpine
    container_name: go-stack-nginx
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      go-api:
        condition: service_started
    networks:
      - frontend
    restart: unless-stopped

  go-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: go-api:v1.0.0
    container_name: go-stack-api
    environment:
      APP_HOST: "0.0.0.0"
      APP_PORT: "8080"
      DB_DSN: "appuser:apppass@tcp(mysql:3306)/appdb?parseTime=true"
      REDIS_ADDR: "redis:6379"
    read_only: true
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "1.0"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - frontend
      - backend
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: go-stack-redis
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - backend
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: go-stack-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: appdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend
    restart: unless-stopped

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true

volumes:
  mysql_data:
